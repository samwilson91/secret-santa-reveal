<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Secret Santa Reveal</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #8f1d26; background: linear-gradient(160deg, #8f1d26, #1f6b3a);
    font-family: Georgia, 'Times New Roman', serif; color: #2b2b2b; padding: 16px;
  }
  .card {
    background: #fffaf2; width: 100%; max-width: 440px; border-radius: 16px;
    padding: 32px 24px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  h1 { margin: 0 0 8px; font-size: 28px; color: #8f1d26; }
  p { margin: 8px 0; line-height: 1.5; }
  .name {
    margin: 24px 0; padding: 18px 8px; font-size: 40px; font-weight: bold; color: #1f6b3a;
    background: #f1e6d3; border-radius: 12px; word-break: break-word;
    filter: blur(14px); transition: filter 1.2s ease; user-select: none;
  }
  .name.revealed { filter: blur(0); user-select: text; }
  button {
    font: bold 18px Arial, Helvetica, sans-serif; color: #fff; background: #1f6b3a;
    border: 0; border-radius: 10px; padding: 14px 28px; cursor: pointer;
  }
  button:hover { background: #17552d; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Secret Santa</h1>
    <div id="ready">
      <p>Your match is ready. Make sure nobody is peeking!</p>
      <div class="name" id="name" aria-live="polite">Loading</div>
      <button id="btn" type="button">Click to show match</button>
    </div>
    <p id="done" class="hidden">Shh. Keep it a secret until the gift is opened!</p>
    <p id="error" class="hidden">This link looks incomplete. Please use the button in your email, or ask Sam.</p>
  </div>
<script>
  function decodeName(hash) {
    try {
      var s = hash.replace(/^#/, '').replace(/-/g, '+').replace(/_/g, '/');
      if (!s) return null;
      while (s.length % 4) s += '=';
      var bytes = Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); });
      return new TextDecoder().decode(bytes);
    } catch (e) { return null; }
  }

  var match = decodeName(window.location.hash);
  var nameEl = document.getElementById('name');
  var btn = document.getElementById('btn');

  if (!match) {
    document.getElementById('ready').classList.add('hidden');
    document.getElementById('error').classList.remove('hidden');
  } else {
    nameEl.textContent = match;  // textContent, never innerHTML
    btn.addEventListener('click', function () {
      nameEl.classList.add('revealed');
      btn.classList.add('hidden');
      document.getElementById('done').classList.remove('hidden');
    });
  }
</script>
</body>
</html>
