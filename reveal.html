<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Secret Santa Reveal</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #8f1d26; background: linear-gradient(160deg, #8f1d26, #1f6b3a);
    font-family: Georgia, 'Times New Roman', serif; color: #2b2b2b; padding: 16px;
  }
  .card {
    background: #fffaf2; width: 100%; max-width: 440px; border-radius: 16px;
    padding: 32px 24px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  h1 { margin: 0 0 8px; font-size: 28px; color: #8f1d26; }
  p { margin: 8px 0; line-height: 1.5; }
  .name {
    margin: 24px 0; padding: 18px 8px; font-size: 40px; font-weight: bold; color: #1f6b3a;
    background: #f1e6d3; border-radius: 12px; word-break: break-word;
    filter: blur(14px); transition: filter 1.2s ease; user-select: none;
  }
  .name.revealed { filter: blur(0); user-select: text; cursor: pointer; animation: pop .7s ease .5s; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
  button {
    font: bold 18px Arial, Helvetica, sans-serif; color: #fff; background: #1f6b3a;
    border: 0; border-radius: 10px; padding: 14px 28px; cursor: pointer;
  }
  button:hover { background: #17552d; }
  .hidden { display: none; }
  .stage { position: relative; width: 100%; max-width: 440px; margin-top: 80px; }
  .stage .card { position: relative; z-index: 2; }
  .santa {
    position: absolute; left: 50%; bottom: 100%; width: 150px; z-index: 1; pointer-events: none;
    transform: translate(-50%, 140px);              /* hidden: tucked behind the card */
    transition: transform .9s cubic-bezier(.34, 1.56, .64, 1) .35s;
  }
  .santa svg { display: block; width: 100%; height: auto; transform-origin: 50% 100%; }
  .santa.out { transform: translate(-50%, 24px); }  /* pops up, beard still tucked behind */
  .santa.out svg { animation: wiggle 2.6s ease-in-out 1.6s infinite; }
  .santa.out.hop svg { animation: hop .6s ease; }
  @keyframes wiggle { 0%, 100% { rotate: -3deg; } 50% { rotate: 3deg; } }
  @keyframes hop { 0% { translate: 0 0; } 40% { translate: 0 -16px; } 100% { translate: 0 0; } }
  .mute { position: fixed; right: 14px; bottom: 14px; z-index: 20; padding: 10px 16px;
          font-size: 14px; background: rgba(255,250,242,.92); color: #1f6b3a; }
  .mute:hover { background: #fffaf2; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  @media (prefers-reduced-motion: reduce) {
    .name { transition: none; }
    .name.revealed { animation: none; }
    .santa { transition: none; }
    .santa.out svg, .santa.out.hop svg { animation: none; }
  }
</style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <button id="mute" class="mute hidden" type="button" aria-pressed="false">♪ Music on</button>
  <div class="stage">
    <div class="santa" id="santa">
      <svg viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Santa peeking out">
        <circle cx="80" cy="86" r="36" fill="#f6c9a0"/>
        <path d="M44 90 C40 132 120 132 116 90 C104 110 56 110 44 90 Z" fill="#ffffff"/>
        <ellipse cx="70" cy="101" rx="13" ry="7" fill="#ffffff"/>
        <ellipse cx="90" cy="101" rx="13" ry="7" fill="#ffffff"/>
        <circle cx="58" cy="94" r="6" fill="#f29b9b" opacity=".7"/>
        <circle cx="102" cy="94" r="6" fill="#f29b9b" opacity=".7"/>
        <circle cx="80" cy="93" r="5.5" fill="#e8847c"/>
        <circle cx="66" cy="82" r="3.6" fill="#2b2b2b"/>
        <circle cx="94" cy="82" r="3.6" fill="#2b2b2b"/>
        <path d="M34 66 C34 28 60 8 84 8 C108 8 126 28 126 66 Z" fill="#d62839"/>
        <path d="M100 12 C128 10 146 28 144 56 C140 64 128 62 128 54 C128 40 116 30 100 28 Z" fill="#d62839"/>
        <rect x="30" y="52" width="100" height="24" rx="12" fill="#ffffff"/>
        <circle cx="139" cy="60" r="10" fill="#ffffff"/>
      </svg>
    </div>
  <div class="card">
    <h1>Secret Santa</h1>
    <div id="ready">
      <p>Your match is ready. Make sure nobody is peeking!</p>
      <div class="name" id="name" aria-live="polite">Loading</div>
      <button id="btn" type="button">Click to show match</button>
    </div>
    <p id="done" class="hidden">Shh. Keep it a secret until the gift is opened! (Tap the name for more confetti.)</p>
    <p id="error" class="hidden">This link looks incomplete. Please use the button in your email, or ask Sam.</p>
  </div>
  </div>
<script>
  // ---------- decode the name from the URL fragment ----------
  function decodeName(hash) {
    try {
      var s = hash.replace(/^#/, '').replace(/-/g, '+').replace(/_/g, '/');
      if (!s) return null;
      while (s.length % 4) s += '=';
      var bytes = Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); });
      return new TextDecoder().decode(bytes);
    } catch (e) { return null; }
  }

  // ---------- confetti ----------
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COLORS = ['#d62839', '#1f8a4c', '#f4c430', '#ffffff', '#e85d75', '#7fd1ae'];
  var SHAPES = ['rect', 'rect', 'circle', 'flake', 'star'];
  var parts = [];
  var looping = false;
  var dpr = window.devicePixelRatio || 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function spawn(x, y, n, angle, spread, power) {
    for (var i = 0; i < n; i++) {
      var a = angle + (Math.random() - 0.5) * spread;
      var v = power * (0.4 + Math.random() * 0.8);
      parts.push({
        x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        size: 6 + Math.random() * 8, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
        tilt: Math.random() * 6.28, tv: 0.1 + Math.random() * 0.2,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        shape: SHAPES[Math.floor(Math.random() * SHAPES.length)]
      });
    }
    if (!looping) { looping = true; requestAnimationFrame(frame); }
  }

  function drawPart(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.strokeStyle = p.color;
    if (p.shape === 'rect') {
      ctx.scale(1, Math.cos(p.tilt));  // flutter effect
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    } else if (p.shape === 'circle') {
      ctx.beginPath(); ctx.arc(0, 0, p.size / 3, 0, 6.283); ctx.fill();
    } else {
      ctx.font = (p.size * 1.6) + 'px Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.shape === 'flake' ? '\u2744' : '\u2605', 0, 0);
    }
    ctx.restore();
  }

  function frame() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += 0.16; p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.tilt += p.tv;
      if (p.y > window.innerHeight + 40) { parts.splice(i, 1); continue; }
      drawPart(p);
    }
    if (parts.length) { requestAnimationFrame(frame); }
    else { looping = false; ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }

  function celebrate(originEl) {
    if (reduceMotion) return;
    var r = originEl.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var w = window.innerWidth, h = window.innerHeight;
    spawn(cx, cy, 110, -Math.PI / 2, Math.PI * 2, 11);                  // pop from the name
    setTimeout(function () {                                           // side cannons
      spawn(0, h, 60, -Math.PI / 3, 0.7, 20);
      spawn(w, h, 60, -2 * Math.PI / 3, 0.7, 20);
    }, 250);
    var shower = setInterval(function () {                             // gentle snow/confetti shower
      spawn(Math.random() * w, -10, 3, Math.PI / 2, 0.6, 2);
    }, 90);
    setTimeout(function () { clearInterval(shower); }, 3000);
  }

  // ---------- music: a synthesized music-box tune (no audio file needed) ----------
  var NOTE = { C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, C5: 523.25 };
  // [note, beats] - "Jingle Bells" chorus (public-domain composition)
  var TUNE = [
    ['E4',1],['E4',1],['E4',2], ['E4',1],['E4',1],['E4',2],
    ['E4',1],['G4',1],['C4',1.5],['D4',0.5], ['E4',4],
    ['F4',1],['F4',1],['F4',1.5],['F4',0.5], ['F4',1],['E4',1],['E4',1],['E4',0.5],['E4',0.5],
    ['E4',1],['D4',1],['D4',1],['E4',1], ['D4',2],['G4',2],
    ['C5',4]
  ];
  var BEAT = 0.3;  // seconds per beat; raise for a slower tune
  var audioCtx = null, master = null, tuneEndsAt = 0, musicOn = true;

  function playTone(freq, t, dur) {
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.6);
    g.connect(master);
    [['triangle', 1], ['sine', 2]].forEach(function (w) {   // body + bell-like overtone
      var o = audioCtx.createOscillator();
      o.type = w[0]; o.frequency.value = freq * w[1];
      o.connect(g); o.start(t); o.stop(t + dur + 0.7);
    });
  }

  function startMusic() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) {
        audioCtx = new AC();
        master = audioCtx.createGain();
        master.gain.value = musicOn ? 0.5 : 0;
        master.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (audioCtx.currentTime < tuneEndsAt) return;          // already playing
      var t = audioCtx.currentTime + 0.1;
      TUNE.forEach(function (n) { playTone(NOTE[n[0]], t, n[1] * BEAT); t += n[1] * BEAT; });
      tuneEndsAt = t + 0.6;
    } catch (e) { /* audio is optional; never break the reveal */ }
  }

  var muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', function () {
    musicOn = !musicOn;
    if (master) master.gain.value = musicOn ? 0.5 : 0;
    muteBtn.textContent = musicOn ? '\u266a Music on' : 'Music off';
    muteBtn.setAttribute('aria-pressed', String(!musicOn));
  });

  // ---------- page logic ----------
  var match = decodeName(window.location.hash);
  var nameEl = document.getElementById('name');
  var btn = document.getElementById('btn');
  var santa = document.getElementById('santa');
  function hopSanta() {
    santa.classList.add('hop');
    setTimeout(function () { santa.classList.remove('hop'); }, 650);
  }

  if (!match) {
    document.getElementById('ready').classList.add('hidden');
    document.getElementById('error').classList.remove('hidden');
  } else {
    nameEl.textContent = match;  // textContent, never innerHTML
    btn.addEventListener('click', function () {
      nameEl.classList.add('revealed');
      btn.classList.add('hidden');
      document.getElementById('done').classList.remove('hidden');
      celebrate(nameEl);
      santa.classList.add('out');
      muteBtn.classList.remove('hidden');
      startMusic();
    });
    nameEl.addEventListener('click', function () {
      if (nameEl.classList.contains('revealed')) { celebrate(nameEl); startMusic(); hopSanta(); }
    });
  }
</script>
</body>
</html>
